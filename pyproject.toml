[project]
name = "recut-cli"
version = "0.1.0"
description = "Auto-clip Kickstarter videos into social media shorts"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "imageio-ffmpeg>=0.4.0",
    "numpy>=1.24.0",
    "openai-whisper>=20250625",
    "openai>=1.0.0",
    "edge-tts>=7.2.7",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
tts-coqui = ["TTS>=0.22.0"]

[project.scripts]
recut = "recut.cli:main"

[project.urls]
Homepage = "https://github.com/windstudio/recutcli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recut*"]
