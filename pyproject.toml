[project]
name = "recut-cli"
version = "0.1.2"
description = "Auto-clip videos from the web into short social media videos with Chinese dubbing"
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "windstudio" }]
keywords = ["video", "kickstarter", "shorts", "dubbing", "subtitle", "whisper", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "imageio-ffmpeg>=0.4.0",
    "numpy>=1.24.0",
    "openai-whisper>=20250625",
    "openai>=1.0.0",
    "edge-tts>=7.2.7",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
tts-coqui = ["TTS>=0.22.0"]
dev = ["pytest>=8.0"]

[project.scripts]
recut = "recut.cli:main"

[project.urls]
Homepage = "https://github.com/windstudio/recutcli"
Repository = "https://github.com/windstudio/recutcli"
Issues = "https://github.com/windstudio/recutcli/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recut*"]
